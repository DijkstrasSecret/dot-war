<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot War menu preview</title>
<!-- Design reference only: shows the agreed look of the main menu over a random menu painting.
     The real menu is built in js/menu.js; the buttons here do nothing. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Cormorant+Garamond:wght@500;600&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  .stage { position: relative; width: 100vw; height: 100vh; container-type: inline-size; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .menu { position: absolute; left: 7cqw; top: 50%; transform: translateY(-50%); display: grid; gap: 2.4cqw; }
  .menu h1 { margin: 0; font: 400 6.2cqw/1 'IM Fell English SC', Georgia, serif; letter-spacing: .04em; color: #fff; }
  .menu .sub { margin: -1.2cqw 0 1.2cqw; font: 500 1.25cqw 'Cormorant Garamond', Georgia, serif; letter-spacing: .32em; text-transform: uppercase; color: #b9ab93; }
  .menu nav { display: grid; gap: 1.1cqw; justify-items: start; }
  .menu button { all: unset; cursor: pointer; font: 600 2.3cqw 'Cormorant Garamond', Georgia, serif; letter-spacing: .14em; text-transform: uppercase; color: #fff; padding: .25cqw 0; position: relative; }
  .menu button::after { content: ''; position: absolute; left: 0; bottom: 0; height: 1px; width: 0; background: #e8a452; transition: width .3s ease; }
  .menu button:hover::after, .menu button:focus-visible::after { width: 100%; }
</style>
</head>
<body>
<div class="stage">
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="menu">
    <h1>Dot War</h1>
    <div class="sub" id="sub"></div>
    <nav><button>New game</button><button>Continue</button><button>Settings</button><button>Quit</button></nav>
  </div>
</div>
<script src="../painting-fx.js"></script>
<script>
  const fx = PaintingFx.create(document.getElementById('fx'), { base: '../' });
  const id = PaintingFx.pick('menu');  // a new random menu painting on every load
  document.getElementById('sub').textContent = PaintingFx.info(id).title;
  fx.show(id); fx.start();
</script>
</body>
</html>
