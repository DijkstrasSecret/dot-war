<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot War loading preview</title>
<!-- Design reference only: the agreed look of the loading screen. The progress here is fake and
     advances to the next painting when full; in the game it should follow real loading. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Cormorant+Garamond:ital,wght@0,600;1,500&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  .stage { position: relative; width: 100vw; height: 100vh; container-type: inline-size; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .veil { position: absolute; inset: 0; background: #000; transition: opacity .45s ease; pointer-events: none; }
  .veil.clear { opacity: 0; }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: linear-gradient(to top, rgba(6,4,2,.88), rgba(6,4,2,.55) 45%, rgba(6,4,2,0)); }
  .hud { position: absolute; left: 3.6cqw; right: 3.6cqw; bottom: 2.6cqw; display: flex; align-items: flex-end; justify-content: space-between; gap: 3cqw; }
  .plaque h2 { margin: 0; font: 400 2.7cqw/1.05 'IM Fell English SC', Georgia, serif; color: #fff; letter-spacing: .03em; }
  .plaque p { margin: .5cqw 0 0; font: italic 500 1.35cqw 'Cormorant Garamond', Georgia, serif; color: #cdbfa6; }
  .load { width: 30cqw; display: grid; gap: .8cqw; }
  .row { display: flex; justify-content: space-between; font: 600 1.2cqw 'Cormorant Garamond', Georgia, serif; letter-spacing: .3em; text-transform: uppercase; color: #e9dfcd; font-variant-numeric: tabular-nums; }
  .track { position: relative; height: max(2px, .22cqw); background: rgba(255,240,210,.18); overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: #e3b565; box-shadow: 0 0 1.2cqw rgba(255,190,90,.7); }
</style>
</head>
<body>
<div class="stage">
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="band"></div>
  <div class="hud">
    <div class="plaque"><h2 id="title"></h2><p id="after"></p></div>
    <div class="load" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" id="lp">
      <div class="row"><span>Loading</span><span id="pct">0%</span></div>
      <div class="track"><div class="fill" id="fill"></div></div>
    </div>
  </div>
  <div class="veil" id="veil"></div>
</div>
<script src="../painting-fx.js"></script>
<script>
  const fx = PaintingFx.create(document.getElementById('fx'), { base: '../' });
  const ids = PaintingFx.ids('loading'), $ = id => document.getElementById(id);
  let i = 0, progress = 0;
  function next() {
    $('veil').classList.remove('clear');
    setTimeout(() => {
      const id = ids[i++ % ids.length], p = PaintingFx.info(id);
      $('title').textContent = p.title; $('after').textContent = p.after; progress = 0;
      fx.show(id).then(() => $('veil').classList.add('clear'));
    }, 450);
  }
  setInterval(() => {
    if (progress >= 100) { progress = 101; return next(); }
    if (progress > 100) return;
    progress = Math.min(100, progress + 2 + Math.random() * 7);
    $('fill').style.width = progress + '%'; $('pct').textContent = Math.floor(progress) + '%'; $('lp').setAttribute('aria-valuenow', Math.floor(progress));
  }, 400);
  next(); fx.start();
</script>
</body>
</html>
