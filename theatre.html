<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dot War Fight Theatre</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<style>
  #bar { left: 8px; right: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 10px; }
  #bar select, #bar input { background: #1f2219; color: var(--text); border: 1px solid var(--line); padding: 3px 6px; font: inherit; }
  #bar input { width: 64px; }
  #bar .grow { flex: 1; }
  #cap { position: fixed; z-index: 6; left: 50%; top: 10px; transform: translateX(-50%); text-align: center; pointer-events: none; }
  #cap .t { font: 600 20px "Bahnschrift", "Segoe UI", sans-serif; letter-spacing: 1px; color: #fff; text-shadow: 0 2px 6px #000, 0 0 2px #000; }
  #cap .n { font-size: 13px; color: #f2eedd; text-shadow: 0 1px 4px #000, 0 0 2px #000; margin-top: 2px; }
  .side { position: fixed; z-index: 6; top: 64px; padding: 6px 10px; font: 600 14px "Bahnschrift", "Segoe UI", sans-serif; color: #fff; border-radius: 3px; background: rgba(20, 22, 17, 0.72); }
  .side b { font-size: 22px; font-family: Consolas, monospace; margin-left: 6px; }
  #sideA { left: 12px; border-left: 4px solid #2458d6; }
  #sideB { right: 12px; border-right: 4px solid #c8302e; text-align: right; }
  #clockT { position: fixed; z-index: 6; left: 50%; top: 72px; transform: translateX(-50%); font: 600 16px Consolas, monospace; color: var(--brass2); text-shadow: 0 1px 4px #000; }
  #banner { position: fixed; z-index: 7; left: 50%; top: 42%; transform: translate(-50%, -50%); padding: 14px 26px; background: rgba(15, 16, 12, 0.85); border: 1px solid var(--brass); border-radius: 4px; text-align: center; color: #fff; font: 600 26px "Bahnschrift", "Segoe UI", sans-serif; }
  #banner .d { font: 400 14px "Segoe UI", sans-serif; color: var(--text); margin-top: 6px; }
  #minimap { display: none; }
  body.match #minimap { display: block; position: fixed; z-index: 6; right: 12px; bottom: 12px; width: 200px; height: 200px; border: 1px solid var(--brass); }
  body.rec #bar { display: none; }
</style>
</head>
<body>
<!-- Fight Theatre: watch the Balance Lab's set-piece fights with the real renderer, both sides visible.
     URL: theatre.html?s=<scenario id>&seed=<n>&speed=<game seconds per second>&note=<text>
     A whole AI-versus-AI match on Highland Pass: theatre.html?match=<seed>&diff=normal -->
<div id="main"><canvas id="game"></canvas></div>
<canvas id="minimap" width="200" height="200"></canvas>
<div id="cap"><div class="t"></div><div class="n"></div></div>
<div id="sideA" class="side"></div>
<div id="sideB" class="side"></div>
<div id="clockT"></div>
<div id="banner" class="hidden"></div>
<div id="bar" class="hud">
  <select id="scen"></select>
  <label class="small">Seed <input id="seed" type="number" value="1" min="1"></label>
  <label class="small">Speed <select id="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select></label>
  <button class="btn" id="play">Pause</button>
  <button class="btn" id="restart">Restart</button>
  <span class="grow"></span>
  <span class="small">1× = one game second per second. Blue attacks from the left, red from the right.</span>
</div>
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/terrain.js"></script>
<script src="js/path.js"></script>
<script src="js/fog.js"></script>
<script src="js/entities.js"></script>
<script src="js/game.js"></script>
<script src="js/ai.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/maps.js"></script>
<script src="js/sim.js"></script>
<script src="lab/lab-tests.js"></script>
<script src="lab/fight-scenarios.js"></script>
<script src="lab/theatre.js"></script>
</body>
</html>
